<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamCall PRO</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        body.obs-mode { background-color: transparent !important; }

        /* --- LOBBY --- */
        .lobby-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #0f172a; padding: 20px; text-align: center; }
        .glass-box { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-width: 400px; width: 100%; }
        input { width: 100%; background: #000; border: 2px solid #334155; color: white; padding: 15px; border-radius: 8px; font-size: 1.2rem; text-align: center; font-weight: bold; margin-bottom: 20px; outline: none; text-transform: uppercase; }
        .quality-select { width: 100%; background: #000; border: 2px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 1rem; text-align: center; font-weight: bold; margin-bottom: 20px; outline: none; cursor: pointer; }
        .btn { width: 100%; padding: 12px; font-weight: 900; font-size: 0.9rem; border-radius: 8px; cursor: pointer; border: none; transition: 0.2s; text-transform: uppercase; }
        .btn-blue { background: #3b82f6; color: white; margin-bottom: 10px; }
        .btn-green { background: #10b981; color: black; margin-bottom: 10px; }
        .btn-red { background: #ef4444; color: white; margin-bottom: 10px; }
        .btn-gray { background: #334155; color: white; margin-bottom: 10px; border: 1px solid #475569; }

        /* --- OBS --- */
        .obs-layout { width: 100vw; height: 100vh; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .obs-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .obs-status { position: relative; z-index: 9999; background: rgba(0,0,0,0.85); color: #facc15; padding: 20px 30px; border-radius: 12px; font-family: monospace; font-size: 16px; border: 2px solid #facc15; text-align: center; }

        /* --- DIRECTOR --- */
        .director-layout { display: flex; height: 100vh; position: relative; }
        .video-stage { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .remote-video { width: 100%; height: 100%; object-fit: contain; }
        .director-controls { width: 350px; background: #0f172a; border-left: 1px solid #334155; display: flex; flex-direction: column; z-index: 10; flex-shrink: 0; padding: 20px; }
        select { width: 100%; background: #000 !important; border: 1px solid #334155 !important; color: #fff !important; padding: 10px; border-radius: 6px; font-size: 0.85rem; outline: none; margin-bottom: 10px; appearance: auto; }
        .tally-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .t-btn { padding: 15px 5px; font-size: 0.8rem; font-weight: bold; border-radius: 8px; cursor: pointer; border: 2px solid transparent; background: #1e293b; color: #94a3b8; }
        .t-btn.active-idle { border-color: #64748b; color: white; }
        .t-btn.active-prev { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e; }
        .t-btn.active-live { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; animation: pulseRed 2s infinite; }
        .clean-mode .director-controls { display: none !important; }
        .clean-mode .video-stage { width: 100vw; }
        .exit-btn { position: absolute; top: 15px; right: 15px; z-index: 100; background: rgba(220, 38, 38, 0.8); color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: 2px solid white; font-size: 12px; }

        /* --- GUEST UI --- */
        .guest-layout { width: 100vw; height: 100vh; position: relative; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .guest-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .guest-tally-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 15px solid transparent; pointer-events: none; transition: border-color 0.3s; z-index: 50; box-sizing: border-box; }
        .guest-layout.tally-live .guest-tally-border { border-color: #ef4444; box-shadow: inset 0 0 50px rgba(239,68,68,0.8); }
        .guest-layout.tally-prev .guest-tally-border { border-color: #22c55e; box-shadow: inset 0 0 50px rgba(34,197,94,0.8); }
        .return-pip { position: absolute; top: 20px; left: 20px; width: 260px; aspect-ratio: 16/9; background: #000; border: 2px solid #475569; border-radius: 12px; overflow: hidden; z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .return-pip.active { opacity: 1; pointer-events: auto; }
        .return-pip video { width: 100%; height: 100%; object-fit: cover; }
        .pip-label { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.8); color: white; font-size: 10px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .guest-overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 12px 25px; border-radius: 50px; display: flex; align-items: center; gap: 15px; z-index: 100; border: 1px solid #333; }
        .mic-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; transition: 0.2s; background: #334155; color: white; }
        .mic-btn.off { background: #ef4444; }
        .big-tally-text { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; font-weight: 900; padding: 5px 20px; border-radius: 10px; z-index: 100; text-transform: uppercase; display: none; }
        .guest-layout.tally-live .big-tally-text { display: block; background: #ef4444; color: white; }
        .guest-layout.tally-prev .big-tally-text { display: block; background: #22c55e; color: black; }
        .error-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(239,68,68,0.9); color: white; padding: 20px; border-radius: 12px; font-weight: bold; text-align: center; z-index: 200; max-width: 80%; }

        /* --- ESTADO DE ENLACE (guest) --- */
        .link-status { position: absolute; top: 14px; right: 14px; z-index: 120; display: flex; gap: 8px; }
        .link-dot { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; padding: 5px 10px; border-radius: 20px; background: rgba(0,0,0,0.7); border: 1px solid #334155; color: #64748b; }
        .link-dot.on { border-color: #22c55e; color: #22c55e; }

        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const PEER_CONFIG = { 
            config: { 
                'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }]
            } 
        };
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';

        // Extrae el ID del peer desde el mensaje de PeerJS ("Could not connect to peer sc_dir_XXXX")
        const extractPeerId = (msg) => {
            const m = /([A-Za-z0-9_\-]+)\s*$/.exec((msg || '').trim());
            return m ? m[1] : null;
        };

        // --- DIRECTOR / OBS ---
        const ReceiverView = ({ roomName, isObsMode }) => {
            const [status, setStatus] = useState('BUSCANDO SEÑAL...');
            const [guestConnected, setGuestConnected] = useState(false);
            const [tally, setTally] = useState('idle');
            const [cleanMode, setCleanMode] = useState(false); 
            const [audioDevices, setAudioDevices] = useState([]);
            const [selectedAudio, setSelectedAudio] = useState('');
            const [talkbackActive, setTalkbackActive] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const peer = useRef(null);
            const remoteVideoRef = useRef(null);
            const mqttClient = useRef(null);
            const returnStreamRef = useRef(null);
            const currentCallRef = useRef(null);

            useEffect(() => {
                let destroyed = false;

                try {
                    mqttClient.current = mqtt.connect(MQTT_BROKER);
                    if (!isObsMode) {
                        navigator.mediaDevices.enumerateDevices().then(devs => {
                            const audios = devs.filter(d => d.kind === 'audioinput');
                            setAudioDevices(audios);
                            if (audios.length > 0) setSelectedAudio(audios[0].deviceId);
                        }).catch(e => console.log('enumerateDevices:', e.message));
                    }

                    const baseId = roomName.toUpperCase();
                    const myId = isObsMode ? `sc_obs_${baseId}` : `sc_dir_${baseId}`;
                    peer.current = new Peer(myId, PEER_CONFIG);

                    peer.current.on('open', () => {
                        setStatus('ESPERANDO INVITADO...');
                    });

                    peer.current.on('call', (call) => {
                        // Cerramos cualquier llamada anterior del mismo invitado (reconexión)
                        try { currentCallRef.current?.close(); } catch (e) {}
                        currentCallRef.current = call;

                        call.answer();

                        call.on('stream', (stream) => {
                            if (destroyed) return;
                            if (remoteVideoRef.current) {
                                remoteVideoRef.current.srcObject = stream;
                            }
                            setGuestConnected(true);
                            setStatus('ONLINE');
                        });

                        call.on('close', () => {
                            if (destroyed) return;
                            setGuestConnected(false);
                            setStatus('INVITADO DESCONECTADO');
                        });

                        call.on('error', () => {
                            if (destroyed) return;
                            setGuestConnected(false);
                            setStatus('INVITADO DESCONECTADO');
                        });
                    });

                    peer.current.on('error', (err) => {
                        if (destroyed) return;

                        // El invitado aún no está: es normal, no lo tratamos como error
                        if (err.type === 'peer-unavailable') {
                            setStatus('ESPERANDO INVITADO...');
                            return;
                        }

                        // La sala ya está abierta en otra pestaña con el mismo ID
                        if (err.type === 'unavailable-id') {
                            setStatus('ID EN USO');
                            setErrorMsg('Esta sala ya está abierta en otra pestaña. Ciérrala o usa otro nombre de sala.');
                            return;
                        }

                        if (err.type === 'network' || err.type === 'server-error') {
                            setStatus('RECONECTANDO...');
                            return;
                        }

                        console.warn('Peer error:', err.type, err.message);
                    });

                    peer.current.on('disconnected', () => {
                        if (destroyed) return;
                        setStatus('RECONECTANDO...');
                        try { peer.current.reconnect(); } catch (e) {}
                    });

                } catch (e) {
                    console.error('Error Director:', e);
                    setErrorMsg(`Error: ${e.message}`);
                }
                
                return () => { 
                    destroyed = true;
                    try { currentCallRef.current?.close(); } catch (e) {}
                    try { peer.current?.destroy(); } catch (e) {}
                    if (mqttClient.current) mqttClient.current.end(); 
                };
            }, [roomName, isObsMode]);

            const handleTally = (s) => {
                setTally(s);
                mqttClient.current?.publish(`sc_tally/${roomName.toUpperCase()}`, JSON.stringify({ state: s }), { retain: true });
            };

            const toggleReturn = async () => {
                if (talkbackActive) {
                    returnStreamRef.current?.getTracks().forEach(t => t.stop());
                    setTalkbackActive(false);
                } else {
                    try {
                        const s = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedAudio }, video: true });
                        returnStreamRef.current = s;
                        peer.current.call(`sc_guest_${roomName.toUpperCase()}`, s);
                        setTalkbackActive(true);
                    } catch (e) { 
                        console.error('Error retorno:', e);
                        setErrorMsg(`Retorno: ${e.message}`);
                    }
                }
            };

            const copyLink = (m) => {
                const url = `${window.location.href.split('?')[0]}?mode=${m}&room=${roomName}`;
                navigator.clipboard.writeText(url); 
                alert(`Link ${m} copiado`);
            };

            if (isObsMode) return (
                <div className="obs-layout">
                    <video ref={remoteVideoRef} className="obs-video" autoPlay playsInline muted={false}></video>
                    {!guestConnected && <div className="obs-status">{status}</div>}
                    {errorMsg && <div className="error-msg">{errorMsg}</div>}
                </div>
            );

            return (
                <div className={`director-layout ${cleanMode ? 'clean-mode' : ''}`}>
                    <div className="video-stage">
                        <video ref={remoteVideoRef} className="remote-video" autoPlay playsInline muted={true}></video>
                        {!guestConnected && <div style={{position:'absolute', color:'#64748b', fontWeight:'bold', textTransform:'uppercase'}}>{status}</div>}
                    </div>
                    <div className="director-controls">
                        <h2 className="text-xl font-black text-blue-400 mb-4 uppercase text-center tracking-tighter">StreamCall PRO</h2>
                        <label style={{color:'#60a5fa', fontWeight:'bold', textTransform:'uppercase', display:'block', marginBottom:'8px', fontSize:'10px'}}>📡 RETORNO AL INVITADO</label>
                        <select value={selectedAudio} onChange={e => setSelectedAudio(e.target.value)}>
                            {audioDevices.map(d => <option key={d.deviceId} value={d.deviceId}>{d.label || 'Mic'}</option>)}
                        </select>
                        <button className={`btn ${talkbackActive ? 'btn-red' : 'btn-blue'} mb-6`} onClick={toggleReturn} disabled={!guestConnected}>
                            {talkbackActive ? '🔴 DETENER RETORNO' : '▶️ ENVIAR RETORNO'}
                        </button>
                        <label style={{color:'#94a3b8', fontWeight:'bold', textTransform:'uppercase', display:'block', marginBottom:'8px', fontSize:'10px'}}>ENLACES</label>
                        <button className="btn btn-green" onClick={()=>copyLink('obs')}>COPIAR OBS</button>
                        <button className="btn btn-blue" onClick={()=>copyLink('guest')}>COPIAR INVITADO</button>
                        <div className="h-px bg-slate-700 w-full my-4"></div>
                        <label style={{color:'#94a3b8', fontWeight:'bold', textTransform:'uppercase', display:'block', marginBottom:'8px', fontSize:'10px'}}>CONTROL TALLY</label>
                        <div className="tally-grid">
                            <button className={`t-btn ${tally==='idle'?'active-idle':''}`} onClick={()=>handleTally('idle')}>OFF</button>
                            <button className={`t-btn ${tally==='prev'?'active-prev':''}`} onClick={()=>handleTally('prev')}>PREV</button>
                            <button className={`t-btn ${tally==='live'?'active-live':''}`} onClick={()=>handleTally('live')}>AIRE</button>
                        </div>
                        <button className="btn btn-gray mt-4" onClick={()=>setCleanMode(true)}>🔲 CLEAN VIEW</button>
                        {cleanMode && <button className="btn btn-red mt-2" onClick={()=>setCleanMode(false)}>SALIR CLEAN</button>}
                        {errorMsg && <div style={{color:'#ef4444', fontSize:'12px', marginTop:'10px'}}>{errorMsg}</div>}
                    </div>
                </div>
            );
        };

        // --- INVITADO (GUEST) ---
        const GuestView = ({ roomName }) => {
            const [joined, setJoined] = useState(false);
            const [quality, setQuality] = useState('720');
            const [tally, setTally] = useState('idle');
            const [micMuted, setMicMuted] = useState(false);
            const [camOff, setCamOff] = useState(false);
            const [receivingVideo, setReceivingVideo] = useState(false);
            const [facingMode, setFacingMode] = useState('user');
            const [errorMsg, setErrorMsg] = useState('');
            const [loading, setLoading] = useState(false);
            const [links, setLinks] = useState({ dir: false, obs: false });

            const localVideoRef = useRef(null);
            const returnMediaRef = useRef(null);
            const peer = useRef(null);
            const mqttClient = useRef(null);
            const localStream = useRef(null);

            const facingModeRef = useRef('user');
            const callState = useRef({});      // targetId -> { status, call, timeout }
            const retryTimer = useRef(null);

            const switchCamera = async () => {
                if (!localStream.current) return;
                const nextMode = facingModeRef.current === 'user' ? 'environment' : 'user';
                facingModeRef.current = nextMode;
                setFacingMode(nextMode);

                const res = { '360': [640,360], '720': [1280,720], '1080': [1920,1080] };
                try {
                    const newVideoState = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: res[quality][0], height: res[quality][1], facingMode: nextMode }
                    });
                    const newVideoTrack = newVideoState.getVideoTracks()[0];
                    const oldVideoTrack = localStream.current.getVideoTracks()[0];

                    // Reemplazamos la pista en todas las conexiones activas
                    const conns = peer.current?.connections || {};
                    Object.keys(conns).forEach(peerId => {
                        (conns[peerId] || []).forEach(connection => {
                            try {
                                const pc = connection.peerConnection || connection._pc || connection._negotiator?._pc;
                                if (!pc || !pc.getSenders) return;
                                const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                                if (sender) sender.replaceTrack(newVideoTrack);
                            } catch (e) { console.warn('replaceTrack:', e); }
                        });
                    });

                    localStream.current.removeTrack(oldVideoTrack);
                    localStream.current.addTrack(newVideoTrack);
                    if (oldVideoTrack) oldVideoTrack.stop();
                    if (localVideoRef.current) localVideoRef.current.srcObject = localStream.current;
                } catch (e) { console.error('Error switchCamera:', e); }
            };

            useEffect(() => {
                if (!joined) return;

                let destroyed = false;
                let mq = null;

                setLoading(true);
                setErrorMsg('');

                const baseId = roomName.toUpperCase();
                const targets = [`sc_dir_${baseId}`, `sc_obs_${baseId}`];

                targets.forEach(t => { callState.current[t] = { status: 'idle', call: null, timeout: null }; });

                // ---- MQTT: TALLY ----
                try {
                    mq = mqtt.connect(MQTT_BROKER);
                    mqttClient.current = mq;
                    mq.on('connect', () => mq.subscribe(`sc_tally/${baseId}`));
                    mq.on('message', (t, msg) => {
                        try {
                            const data = JSON.parse(msg.toString());
                            if (t.includes('tally')) setTally(data.state || 'idle');
                        } catch (e) {}
                    });
                    mq.on('error', (e) => console.warn('MQTT error:', e.message));
                } catch (e) { console.warn('MQTT Error:', e); }

                // ---- LLAMADAS CON REINTENTO ----
                const resetState = (targetId) => {
                    const st = callState.current[targetId];
                    if (!st) return;
                    if (st.timeout) clearTimeout(st.timeout);
                    st.timeout = null;
                    try { st.call?.close(); } catch (e) {}
                    st.call = null;
                    st.status = 'idle';
                };

                const attemptCall = (targetId) => {
                    if (destroyed) return;
                    const st = callState.current[targetId];
                    if (!st || st.status !== 'idle') return;
                    if (!peer.current || peer.current.destroyed || !localStream.current) return;

                    st.status = 'trying';

                    let call = null;
                    try {
                        call = peer.current.call(targetId, localStream.current);
                    } catch (e) {
                        st.status = 'idle';
                        return;
                    }
                    if (!call) { st.status = 'idle'; return; }
                    st.call = call;

                    call.on('stream', (rem) => {
                        if (destroyed) return;
                        st.status = 'live';
                        if (st.timeout) { clearTimeout(st.timeout); st.timeout = null; }
                        setLinks(prev => ({ ...prev, [targetId.startsWith('sc_dir') ? 'dir' : 'obs']: true }));

                        // Retorno del director (PIP)
                        if (targetId.startsWith('sc_dir') && rem.getVideoTracks().length > 0) {
                            if (returnMediaRef.current) returnMediaRef.current.srcObject = rem;
                            setReceivingVideo(true);
                        }
                    });

                    call.on('close', () => {
                        if (destroyed) return;
                        setLinks(prev => ({ ...prev, [targetId.startsWith('sc_dir') ? 'dir' : 'obs']: false }));
                        resetState(targetId);
                    });

                    call.on('error', () => {
                        if (destroyed) return;
                        setLinks(prev => ({ ...prev, [targetId.startsWith('sc_dir') ? 'dir' : 'obs']: false }));
                        resetState(targetId);
                    });

                    // Red de seguridad: si en 6 s no hubo error, damos la conexión por buena
                    st.timeout = setTimeout(() => {
                        if (st.status === 'trying') {
                            st.status = 'live';
                            st.timeout = null;
                        }
                    }, 6000);
                };

                const attemptAll = () => targets.forEach(attemptCall);

                // ---- INIT ----
                const init = async () => {
                    try {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            throw new Error('getUserMedia no disponible. Se requiere HTTPS.');
                        }

                        const res = { '360': [640,360], '720': [1280,720], '1080': [1920,1080] };
                        const s = await navigator.mediaDevices.getUserMedia({ 
                            video: { width: { ideal: res[quality][0] }, height: { ideal: res[quality][1] }, facingMode: facingModeRef.current }, 
                            audio: { echoCancellation: true, noiseSuppression: true } 
                        });

                        if (destroyed) { s.getTracks().forEach(t => t.stop()); return; }

                        localStream.current = s;
                        if (localVideoRef.current) localVideoRef.current.srcObject = s;

                        peer.current = new Peer(`sc_guest_${baseId}`, PEER_CONFIG);

                        peer.current.on('open', () => {
                            if (destroyed) return;
                            setLoading(false);
                            attemptAll();
                            // Reintento periódico (solo actúa sobre los targets en estado "idle")
                            retryTimer.current = setInterval(attemptAll, 4000);
                        });

                        peer.current.on('error', (err) => {
                            if (destroyed) return;

                            // *** AQUÍ SE CORRIGE EL ERROR 'peer-unavailable' ***
                            // Es totalmente normal: el director u OBS todavía no tiene la página abierta.
                            if (err.type === 'peer-unavailable') {
                                const id = extractPeerId(err.message);
                                if (id && callState.current[id]) {
                                    resetState(id);
                                    setLinks(prev => ({ ...prev, [id.startsWith('sc_dir') ? 'dir' : 'obs']: false }));
                                } else {
                                    // No pudimos identificar el destino: reintentamos los que estén intentando
                                    Object.keys(callState.current).forEach(k => {
                                        if (callState.current[k].status === 'trying') resetState(k);
                                    });
                                }
                                return; // NO se muestra al usuario
                            }

                            if (err.type === 'unavailable-id') {
                                setErrorMsg('Esta sala ya está abierta en otra pestaña. Ciérrala y recarga.');
                                setLoading(false);
                                return;
                            }

                            if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
                                // PeerJS intenta reconectar solo; solo avisamos en consola
                                console.warn('Peer error:', err.type, err.message);
                                return;
                            }

                            console.warn('Peer error:', err.type, err.message);
                        });

                        peer.current.on('disconnected', () => {
                            if (destroyed) return;
                            try { peer.current.reconnect(); } catch (e) {}
                        });

                        // Llamadas ENTRANTES = retorno del director (talkback)
                        peer.current.on('call', (c) => {
                            c.answer(); // no devolvemos nada en esta llamada
                            c.on('stream', (rem) => {
                                if (destroyed) return;
                                if (rem.getVideoTracks().length > 0) {
                                    if (returnMediaRef.current) returnMediaRef.current.srcObject = rem;
                                    setReceivingVideo(true);
                                }
                            });
                            c.on('close', () => { if (!destroyed) setReceivingVideo(false); });
                        });

                        setLoading(false);

                    } catch (e) {
                        console.error('Error init:', e);
                        if (!destroyed) {
                            setErrorMsg(`Error: ${e.message}`);
                            setLoading(false);
                        }
                    }
                };

                init();

                return () => {
                    destroyed = true;
                    if (retryTimer.current) { clearInterval(retryTimer.current); retryTimer.current = null; }
                    Object.keys(callState.current).forEach(k => {
                        if (callState.current[k]?.timeout) clearTimeout(callState.current[k].timeout);
                        try { callState.current[k]?.call?.close(); } catch (e) {}
                    });
                    callState.current = {};
                    try { peer.current?.destroy(); } catch (e) {}
                    peer.current = null;
                    if (mq) mq.end();
                    localStream.current?.getTracks().forEach(t => t.stop());
                    localStream.current = null;
                };
                // Solo dependemos de joined/roomName: quality y facingMode se gestionan por pistas
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [joined, roomName]);

            const toggleMic = () => { 
                if (localStream.current) { 
                    const t = localStream.current.getAudioTracks()[0]; 
                    if (t) { t.enabled = !t.enabled; setMicMuted(!t.enabled); }
                } 
            };
            const toggleCam = () => { 
                if (localStream.current) { 
                    const t = localStream.current.getVideoTracks()[0]; 
                    if (t) { t.enabled = !t.enabled; setCamOff(!t.enabled); }
                } 
            };

            if (!joined) return (
                <div className="lobby-container">
                    <div className="glass-box">
                        <h2 className="text-2xl font-black mb-4 text-white uppercase tracking-widest">SALA: {roomName}</h2>
                        <select className="quality-select" value={quality} onChange={e => setQuality(e.target.value)}>
                            <option value="360">360p (BAJA)</option>
                            <option value="720">720p (MEDIA)</option>
                            <option value="1080">1080p (ALTA)</option>
                        </select>
                        <button className="btn btn-blue w-full mt-2" onClick={() => setJoined(true)}>ENTRAR AL VIVO</button>
                    </div>
                </div>
            );

            return (
                <div className={`guest-layout tally-${tally}`}>
                    <div className="guest-tally-border"></div>
                    <div className="big-tally-text">{tally === 'live' ? 'AL AIRE' : tally === 'prev' ? 'PREVENIDO' : ''}</div>

                    <div className="link-status">
                        <div className={`link-dot ${links.dir ? 'on' : ''}`}>DIR {links.dir ? '✓' : '…'}</div>
                        <div className={`link-dot ${links.obs ? 'on' : ''}`}>OBS {links.obs ? '✓' : '…'}</div>
                    </div>

                    <div className={`return-pip ${receivingVideo ? 'active' : ''}`}>
                        <video ref={returnMediaRef} autoPlay playsInline muted={false}></video>
                        <div className="pip-label">RETORNO</div>
                    </div>
                    <video ref={localVideoRef} className="guest-video" style={{ transform: facingMode === 'user' ? 'scaleX(-1)' : 'none', objectFit: 'cover' }} muted autoPlay playsInline></video>
                    {loading && <div className="error-msg" style={{background:'rgba(59,130,246,0.9)'}}>CARGANDO CÁMARA...</div>}
                    {errorMsg && <div className="error-msg">{errorMsg}</div>}
                    <div className="guest-overlay">
                        <div style={{fontWeight:'bold', color:'#94a3b8', textTransform:'uppercase', marginRight:'8px', fontSize:'10px'}}>{roomName}</div>
                        <div className={`mic-btn ${micMuted?'off':'on'}`} onClick={toggleMic}>{micMuted ? '🔇' : '🎤'}</div>
                        <div className={`mic-btn ${camOff?'off':'on'}`} onClick={toggleCam}>{camOff ? '🚫' : '📷'}</div>
                        <div className="mic-btn" style={{ background: '#3b82f6' }} onClick={switchCamera}>🔄</div>
                    </div>
                </div>
            );
        };

        // --- APP ROUTER ---
        const App = () => {
            const [mode, setMode] = useState(null); 
            const [roomName, setRoomName] = useState('');
            
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                let m = params.get('mode'); 
                let r = params.get('room');
                if (m && r) { 
                    setRoomName(r.toUpperCase()); 
                    setMode(m); 
                    if (m === 'obs') document.body.classList.add('obs-mode'); 
                } else {
                    setRoomName(Math.random().toString(36).substring(2, 6).toUpperCase());
                }
            }, []);
            
            if (mode === 'director') return <ReceiverView roomName={roomName} isObsMode={false} />;
            if (mode === 'obs') return <ReceiverView roomName={roomName} isObsMode={true} />;
            if (mode === 'guest') return <GuestView roomName={roomName} />;
            
            return (
                <div className="lobby-container">
                    <div className="glass-box">
                        <h1 className="text-3xl font-black mb-6 uppercase text-blue-500 tracking-tighter">StreamCall PRO</h1>
                        <input value={roomName} onChange={(e) => setRoomName(e.target.value.toUpperCase())} placeholder="NOMBRE SALA" />
                        <button className="btn btn-blue w-full" onClick={() => window.location.href=`?mode=director&room=${roomName}`}>PANEL DIRECTOR</button>
                    </div>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
